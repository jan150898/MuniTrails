# Test Profile Configuration

# Database: Use H2 in-memory for tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Flyway disabled for tests (use Hibernate ddl-auto instead)
spring.flyway.enabled=false

# JDBC sessions stay active with spring-session-jdbc on the classpath
# (Boot 3.3 registers the repository by class presence). Create the
# SPRING_SESSION tables in the H2 database so CSRF/session writes work.
spring.session.jdbc.initialize-schema=always

# Session
spring.session.store-type=none

# Logging
logging.level.com.example.trails=DEBUG
logging.level.org.springframework.security=DEBUG

# Garmin service (mock URL)
garmin.service.url=http://localhost:5000

# Encryption key for tests (development only)
app.encryption.key=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

# MockMvc does not traverse a TLS proxy. Production still requires HTTPS.
security.require-https=false
garmin.service.auth-token=test-internal-token
