server.port=8080
spring.thymeleaf.cache=false
logging.level.org.springframework.security=INFO

# PostgreSQL (set these before running)
spring.datasource.url=jdbc:postgresql://localhost:5432/trails
spring.datasource.username=trails
spring.datasource.password=trails
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false

# Garmin microservice
garmin.service.url=http://garmin-service:5000
