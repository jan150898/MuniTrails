# Load secrets from environment variables at startup
spring.config.import=optional:secrets

server.port=${PORT:8080}
server.forward-headers-strategy=native
spring.thymeleaf.cache=false
logging.level.org.springframework.security=INFO

# Secure session cookies (only sent over HTTPS in production)
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}

# Keep authenticated browser sessions in PostgreSQL, so an app restart does
# not discard the user's JSESSIONID session after an upload or deployment.
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=30d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# PostgreSQL (set these before running)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema. Hibernate must only validate that entities match
# the migrated schema, never auto-alter tables at runtime.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false

# Garmin microservice (use localhost:5000 for local development, or docker service name in Docker)
garmin.service.url=${GARMIN_SERVICE_URL:http://garmin-service:5000}

# AES-256 key (64 hex chars) used to encrypt Garmin credentials at rest.
# REQUIRED in production - app fails to start without it. Generate with:
#   openssl rand -hex 32
app.encryption.key=${APP_ENCRYPTION_KEY:}

# Limit upload size to prevent denial-of-service via oversized GPX files
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Actuator: expose only a minimal health endpoint for Fly.io health checks.
# Everything else (metrics, env, beans) is disabled to avoid leaking
# internal details.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoints.web.base-path=/actuator
