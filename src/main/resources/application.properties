# Load secrets from environment variables at startup
spring.config.import=optional:secrets

server.port=${PORT:8080}
server.forward-headers-strategy=native
spring.thymeleaf.cache=false
logging.level.org.springframework.security=INFO

# TLS is enabled by the home-server Compose override. Local development keeps
# the default HTTP listener unless TLS_ENABLED=true is supplied.
server.ssl.enabled=${TLS_ENABLED:false}
server.ssl.key-store=${TLS_KEYSTORE:}
server.ssl.key-store-type=${TLS_KEYSTORE_TYPE:PKCS12}
server.ssl.key-alias=${TLS_KEY_ALIAS:trails}
server.ssl.key-store-password=${TLS_KEYSTORE_PASSWORD:}

# Secure session cookies (only sent over HTTPS in production)
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}

# Keep authenticated browser sessions in PostgreSQL, so an app restart does
# not discard the user's JSESSIONID session after an upload or deployment.
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=30d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# PostgreSQL (set these before running)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}

# Flyway owns the schema. Hibernate must only validate that entities match
# the migrated schema, never auto-alter tables at runtime.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Garmin microservice (use localhost:5000 for local development, or docker service name in Docker)
garmin.service.url=${GARMIN_SERVICE_URL}
garmin.service.use-identity-token=${GARMIN_SERVICE_USE_IDENTITY_TOKEN:false}
garmin.service.audience=${GARMIN_SERVICE_AUDIENCE:}
# Shared secret used to authenticate calls to the internal Garmin service.
# Set GARMIN_SERVICE_AUTH_TOKEN to the same strong value in both services.
garmin.service.auth-token=${GARMIN_SERVICE_AUTH_TOKEN:}

# AES-256 key (64 hex chars) used to encrypt Garmin credentials at rest.
# REQUIRED in production - app fails to start without it. Generate with:
#   openssl rand -hex 32
app.encryption.key=${APP_ENCRYPTION_KEY:}

# Limit upload size to prevent denial-of-service via oversized GPX files
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Actuator: expose only a minimal health endpoint for Fly.io health checks.
# Everything else (metrics, env, beans) is disabled to avoid leaking
# internal details.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoints.web.base-path=/actuator

# Disable mail health check if mail is not configured
management.health.mail.enabled=false

# Email Configuration (for registration verification)
# Set to false to disable email sending (useful for development)
app.email.enabled=${APP_EMAIL_ENABLED:false}
app.email.from=${APP_EMAIL_FROM:noreply@munitrails.local}

# SMTP Configuration (optional - leave empty if email is disabled)
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_TIMEOUT:5000}
