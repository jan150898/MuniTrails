server.port=${PORT:8080}
spring.thymeleaf.cache=false
logging.level.org.springframework.security=INFO

# Profile-based configuration
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ============================================================================
# LOCAL PROFILE (default): PostgreSQL + Flyway
# ============================================================================
---
spring.config.activate.on-profile=local

# Keep authenticated browser sessions in PostgreSQL
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=30d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# PostgreSQL (set these before running)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trails}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:trails}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:trails}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false

garmin.service.url=${GARMIN_SERVICE_URL:http://localhost:5000}

# ============================================================================
# CLOUD RUN PROFILE: H2 In-Memory (no database required)
# Activated by setting: SPRING_PROFILES_ACTIVE=cloudrun
# ============================================================================
---
spring.config.activate.on-profile=cloudrun

# No persistent sessions (in-memory only)
spring.session.store-type=none

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Disable Flyway (no migration files for H2)
spring.flyway.enabled=false

garmin.service.url=${GARMIN_SERVICE_URL:http://localhost:5000}
