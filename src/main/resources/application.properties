server.port=${PORT:8080}
spring.thymeleaf.cache=false
logging.level.org.springframework.security=INFO

# Keep authenticated browser sessions in PostgreSQL, so an app restart does
# not discard the user's JSESSIONID session after an upload or deployment.
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=30d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# PostgreSQL (set these before running)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/postgres
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false

# Garmin microservice (use localhost:5000 for local development, or docker service name in Docker)
garmin.service.url=${GARMIN_SERVICE_URL:http://localhost:5000}
