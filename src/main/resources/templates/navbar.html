<!--
    Shared navigation bar - the single source of truth for the header.

    Every authenticated page includes it with:
        <div th:replace="~{navbar :: navbar}"></div>

    Navbar styling lives in /css/app.css (loaded on all pages).
-->
<th:block th:fragment="navbar">
    <!-- Expose the CSRF token so csrf.js can attach it to every fetch() call.
         Rendering ${_csrf.token} also guarantees Spring generates the token
         (and the XSRF-TOKEN cookie) on every page, so Garmin/API POSTs
         (login, activities, analyze, import) don't fail with a 403 Forbidden. -->
    <input type="hidden" id="csrf-token" th:value="${_csrf.token}" />

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand-text" href="/landing">🏔️ Muni Trails</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch to dark mode" aria-pressed="false"><span data-theme-icon>☾</span><span data-theme-label>Dark</span></button></li>
                    <li class="nav-item"><a class="nav-link" id="nav-home" href="/landing">🏠 Home</a></li>
                    <li class="nav-item"><a class="nav-link" id="nav-explore" href="/tours">🔍 Explore Tours</a></li>
                    <li class="nav-item"><a class="nav-link" id="nav-upload" href="/profile">📤 Upload Tour</a></li>
                    <li class="nav-item"><a class="nav-link" id="nav-profile" href="/profile">👤 My Profile</a></li>
                    <li class="nav-item">
                        <form th:action="@{/logout}" method="post" style="display:inline;">
                            <button type="submit" class="nav-link nav-link-logout">🚪 Logout</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <script>
        // Highlight the nav link for the current page.
        document.addEventListener('DOMContentLoaded', function () {
            const currentPath = window.location.pathname;
            if (currentPath.includes('/landing') || currentPath === '/') {
                document.getElementById('nav-home')?.classList.add('active');
            } else if (currentPath.includes('/tours')) {
                document.getElementById('nav-explore')?.classList.add('active');
            } else if (currentPath.includes('/profile')) {
                document.getElementById('nav-profile')?.classList.add('active');
            }
        });
    </script>
</th:block>
