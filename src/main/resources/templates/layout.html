<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - Muni Trails">Muni Trails</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --success: #198754;
            --danger: #dc3545;
            --light: #f8f9fa;
            --dark: #2c3e50;
        }
        
        * { box-sizing: border-box; }
        
        html, body {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        
        /* NAVBAR styles live in the shared navbar fragment (navbar.html / app.css) */

        /* MAIN CONTENT */
        main {
            flex: 1;
            width: 100%;
        }
        
        .container, .container-fluid {
            max-width: 1400px;
        }
        
        /* FOOTER */
        .footer {
            background: linear-gradient(135deg, var(--dark) 0%, #1a252f 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
            margin-top: 60px;
            border-top: 4px solid var(--primary);
            width: 100%;
            flex-shrink: 0;
        }
        
        .footer p {
            margin: 0;
            font-weight: 500;
            opacity: 0.9;
        }
        
        .footer-links {
            margin-bottom: 15px;
        }
        
        .footer-links a {
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            margin: 0 15px;
            transition: color 0.3s ease;
        }
        
        .footer-links a:hover {
            color: white;
        }
        
        /* RESPONSIVE */
        @media (max-width: 768px) {
            .footer {
                padding: 30px 15px;
            }
        }
    </style>
    
    <th:block layout:fragment="extra-styles"></th:block>
    <link rel="stylesheet" href="/css/app.css">
    <script src="/js/theme.js"></script>
    <script src="/js/csrf.js"></script>
</head>
<body>
    <!-- NAVBAR (shared navbar fragment) -->
    <div th:replace="~{navbar :: navbar}"></div>

    <!-- MAIN CONTENT -->
    <main layout:fragment="content"></main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2024 Muni Trails. Share your mountain adventures.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <th:block layout:fragment="extra-scripts"></th:block>
</body>
</html>
