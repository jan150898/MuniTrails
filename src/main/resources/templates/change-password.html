<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muni Trails - Change Password</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--brand-primary) 0%, var(--brand-secondary) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .wrap {
            max-width: 420px;
            width: 100%;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            margin: 0 0 25px 0;
            text-align: center;
            color: #333;
            font-size: 1.5rem;
            font-weight: 700;
        }
        .row { margin: 16px 0; }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 0.95rem;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: linear-gradient(135deg, var(--brand-primary) 0%, var(--brand-secondary) 100%);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        .msg-error {
            margin: 15px 0;
            padding: 12px 15px;
            border-radius: 6px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            font-size: 0.9rem;
        }
        .msg-success {
            margin: 15px 0;
            padding: 12px 15px;
            border-radius: 6px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
            font-size: 0.9rem;
        }
        .hint {
            font-size: 0.8rem;
            color: #666;
            margin-top: 6px;
        }
        a.back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: var(--brand-primary);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
    <link rel="stylesheet" href="/css/app.css">
    <script src="/js/theme.js"></script>
    <script src="/js/csrf.js"></script>
</head>
<body>
<div class="wrap">
    <h1>🔐 Change Password</h1>

    <div th:if="${error}" class="msg-error" th:text="${error}"></div>
    <div th:if="${success}" class="msg-success" th:text="${success}"></div>

        <form id="changePasswordForm" th:action="@{/change-password}" method="post">
        <!-- CSRF token for this native form POST. Spring Security's default
             XorCsrfTokenRequestAttributeHandler only honours the _csrf parameter
             (it never reads the cookie for a form post), so the field must exist. -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div class="row">
            <label for="currentPassword">Current Password</label>
            <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required />
        </div>
        <div class="row">
            <label for="newPassword">New Password</label>
            <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required minlength="8" />
            <div class="hint">At least 8 characters, including a letter and a number.</div>
        </div>
        <div class="row">
            <label for="confirmPassword">Confirm New Password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required minlength="8" />
        </div>
        <div class="row">
            <button type="submit">Change Password</button>
        </div>
    </form>

        <a class="back" href="/profile">&larr; Back to Profile</a>
</div>
    <script>
    // Client-side mirror of PasswordPolicy (8+ chars, >=1 letter, >=1 digit) plus a
    // confirmation check, so users get instant feedback before the form hits the
    // server. The backend enforces the same rules regardless.
    (function () {
        var form = document.getElementById('changePasswordForm');
        if (!form) return;
        function policyOk(v) {
            return v.length >= 8 && /[a-zA-Z]/.test(v) && /[0-9]/.test(v);
        }
        form.addEventListener('submit', function (e) {
            var current = form.currentPassword;
            var nw = form.newPassword;
            var conf = form.confirmPassword;
            if (!current.value) {
                current.setCustomValidity('Current password is required.');
                current.reportValidity(); e.preventDefault(); return;
            }
            current.setCustomValidity('');
            if (!policyOk(nw.value)) {
                nw.setCustomValidity('Password must be at least 8 characters and include a letter and a number.');
                nw.reportValidity(); e.preventDefault(); return;
            }
            nw.setCustomValidity('');
            if (nw.value !== conf.value) {
                conf.setCustomValidity('New passwords do not match.');
                conf.reportValidity(); e.preventDefault(); return;
            }
            conf.setCustomValidity('');
        });
    })();
    </script>
</body>
</html>
