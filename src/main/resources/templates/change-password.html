<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muni Trails - Change Password</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .wrap {
            max-width: 420px;
            width: 100%;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            margin: 0 0 25px 0;
            text-align: center;
            color: #333;
            font-size: 1.5rem;
            font-weight: 700;
        }
        .row { margin: 16px 0; }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 0.95rem;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        .msg-error {
            margin: 15px 0;
            padding: 12px 15px;
            border-radius: 6px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            font-size: 0.9rem;
        }
        .msg-success {
            margin: 15px 0;
            padding: 12px 15px;
            border-radius: 6px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
            font-size: 0.9rem;
        }
        .hint {
            font-size: 0.8rem;
            color: #666;
            margin-top: 6px;
        }
        a.back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
    <link rel="stylesheet" href="/css/app.css">
    <script src="/js/theme.js"></script>
    <script src="/js/csrf.js"></script>
</head>
<body>
<div class="wrap">
    <h1>🔐 Change Password</h1>

    <div th:if="${error}" class="msg-error" th:text="${error}"></div>
    <div th:if="${success}" class="msg-success" th:text="${success}"></div>

    <form th:action="@{/change-password}" method="post">
        <div class="row">
            <label for="currentPassword">Current Password</label>
            <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required />
        </div>
        <div class="row">
            <label for="newPassword">New Password</label>
            <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required />
            <div class="hint">At least 8 characters, including a letter and a number.</div>
        </div>
        <div class="row">
            <label for="confirmPassword">Confirm New Password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required />
        </div>
        <div class="row">
            <button type="submit">Change Password</button>
        </div>
    </form>

    <a class="back" href="/profile">&larr; Back to Profile</a>
</div>
</body>
</html>
