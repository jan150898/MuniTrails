<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tour.name} + ' | Muni Trails'">Tour | Muni Trails</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4"><div class="container"><a class="navbar-brand" href="/landing">Muni Trails</a><a class="btn btn-outline-light" href="/tours">All tours</a></div></nav>
<main class="container pb-5">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-start gap-3">
                <div><h1 class="h2 mb-1" th:text="${tour.name}">Tour name</h1><span class="badge text-bg-primary" th:text="${tour.type}">TOUR</span></div>
                <span class="badge text-bg-secondary" th:text="${tour.status}">DRAFT</span>
            </div>
            <hr>
            <div class="row row-cols-2 row-cols-md-4 g-3 text-center">
                <div class="col"><div class="text-muted small">Distance</div><strong th:text="${#numbers.formatDecimal(tour.distanceMeters / 1000, 0, 'COMMA', 1, 'POINT')} + ' km'">0 km</strong></div>
                <div class="col"><div class="text-muted small">Elevation gain</div><strong th:text="${#numbers.formatDecimal(tour.elevationGainMeters, 0, 'COMMA', 0, 'POINT')} + ' m'">0 m</strong></div>
                <div class="col"><div class="text-muted small">Elevation loss</div><strong th:text="${#numbers.formatDecimal(tour.elevationLossMeters, 0, 'COMMA', 0, 'POINT')} + ' m'">0 m</strong></div>
                <div class="col"><div class="text-muted small">Rating</div><strong th:text="${tour.overallRating} + ' / 10'">0 / 10</strong></div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
