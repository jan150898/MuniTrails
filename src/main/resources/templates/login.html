<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muni Trails - Login</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--brand-primary) 0%, var(--brand-secondary) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .wrap {
            max-width: 420px;
            width: 100%;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--brand-primary);
        }

        .brand-icon {
            font-size: 2.5rem;
            margin-right: 10px;
        }

        h1 {
            margin: 0 0 25px 0;
            text-align: center;
            color: #333;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .row {
            margin: 16px 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 0.95rem;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: linear-gradient(135deg, var(--brand-primary) 0%, var(--brand-secondary) 100%);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .msg {
            margin: 15px 0;
            padding: 12px 15px;
            border-radius: 6px;
            background: #fff7ed;
            border: 1px solid #fed7aa;
            color: #92400e;
            font-size: 0.9rem;
        }
        
        .register-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 0.9rem;
            color: #666;
        }
        
        .register-link a {
            color: var(--brand-primary);
            text-decoration: none;
            font-weight: 600;
        }
        
        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
    <link rel="stylesheet" href="/css/app.css">
    <script src="/js/theme.js"></script>
    <script src="/js/csrf.js"></script>
</head>
<body>
    <button type="button" class="theme-toggle theme-toggle-fixed" data-theme-toggle aria-label="Switch to dark mode" aria-pressed="false"><span data-theme-icon>☾</span><span data-theme-label>Dark</span></button>
<div class="wrap">
    <div class="brand">
        <div class="brand-icon">🏔️</div>
        <div>Muni Trails</div>
    </div>
    <h1>Welcome Back</h1>

    <div th:if="${param.error}" class="msg">
        ❌ Invalid username or password, or your account is temporarily locked after too many failed attempts.
    </div>
    <div th:if="${param.logout}" class="msg">
        ✓ You have been logged out successfully.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="row">
            <label for="username">Email address</label>
            <input id="username" name="username" type="email" autocomplete="email" placeholder="you@example.com" required />
        </div>
        <div class="row">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required />
        </div>
        <div class="row">
            <button type="submit">Sign in</button>
        </div>
    </form>

    <div class="register-link">
        Don't have an account? <a th:href="@{/auth/register}">Create one here</a>
    </div>

</div>
</body>
</html>
