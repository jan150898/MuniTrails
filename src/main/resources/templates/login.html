<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muni Trails - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .wrap {
            max-width: 420px;
            width: 100%;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            font-size: 1.8rem;
            font-weight: 800;
            color: #667eea;
        }

        .brand-icon {
            font-size: 2.5rem;
            margin-right: 10px;
        }

        h1 {
            margin: 0 0 25px 0;
            text-align: center;
            color: #333;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .row {
            margin: 16px 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 0.95rem;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .msg {
            margin: 15px 0;
            padding: 12px 15px;
            border-radius: 6px;
            background: #fff7ed;
            border: 1px solid #fed7aa;
            color: #92400e;
            font-size: 0.9rem;
        }

        .demo-section {
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid #eee;
            font-size: 0.9rem;
            color: #666;
        }

        .demo-section strong {
            color: #333;
            font-weight: 600;
        }

        .demo-accounts {
            margin-top: 12px;
            padding: 12px;
            background: #f0f7ff;
            border: 1px solid #cce5ff;
            border-radius: 6px;
        }

        .demo-account {
            margin: 8px 0;
            font-family: 'Courier New', monospace;
        }

        .demo-account span {
            color: #667eea;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="brand">
        <div class="brand-icon">🏔️</div>
        <div>Muni Trails</div>
    </div>
    <h1>Welcome Back</h1>

    <div th:if="${param.error}" class="msg">
        ❌ Invalid username or password.
    </div>
    <div th:if="${param.logout}" class="msg">
        ✓ You have been logged out successfully.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="row">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" placeholder="Enter your username" required />
        </div>
        <div class="row">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required />
        </div>
        <div class="row">
            <button type="submit">Sign in</button>
        </div>
    </form>

    <div class="demo-section">
        <strong>Demo Credentials:</strong>
        <div class="demo-accounts">
            <div class="demo-account">Admin: <span>admin / admin123</span></div>
            <div class="demo-account">User: <span>user / user123</span></div>
        </div>
    </div>
</div>
</body>
</html>
