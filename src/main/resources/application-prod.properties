# Production Profile - Real PostgreSQL Database on Cloud SQL
# This profile is used when deployed to Cloud Run in production
# Activated by: ENV SPRING_PROFILES_ACTIVE=prod in Dockerfile

# ============================================================================
# DATABASE CONNECTION (Cloud SQL PostgreSQL - Public IP)
# ============================================================================
spring.datasource.url=jdbc:postgresql://34.53.235.5:5432/trails
spring.datasource.username=trails_user
spring.datasource.password=1998Kati
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================================
# JPA / HIBERNATE
# ============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ============================================================================
# FLYWAY - Database Migrations
# ============================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# ============================================================================
# PERSISTENT SESSIONS - Store in PostgreSQL
# ============================================================================
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=30d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ============================================================================
# GARMIN SERVICE (point to actual service if deployed)
# ============================================================================
garmin.service.url=http://localhost:5000

# ============================================================================
# SERVER CONFIGURATION
# ============================================================================
server.port=8080
spring.thymeleaf.cache=true
logging.level.org.springframework.security=INFO
