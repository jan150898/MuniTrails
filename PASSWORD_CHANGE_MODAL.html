<!-- ADD THIS MODAL BEFORE </body> TAG IN profile.html -->

<!-- Change Password Modal -->
<div class="modal fade" id="changePasswordModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header modal-header-gradient">
                <h5 class="modal-title">🔐 Change Password</h5>
                <button type="button" class="btn-close" style="filter:invert(1);" data-bs-dismiss="modal"></button>
            </div>
            <form id="changePasswordForm" method="post" action="/change-password">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Current Password</label>
                        <input type="password" name="currentPassword" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">New Password</label>
                        <input type="password" name="newPassword" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Confirm Password</label>
                        <input type="password" name="confirmPassword" class="form-control" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn text-white" style="background:linear-gradient(135deg,#667eea,#764ba2);border:none;">Change Password</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- ALSO ADD THIS BUTTON in the profile header/user info section -->
<button class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#changePasswordModal">
    🔐 Change Password
</button>
