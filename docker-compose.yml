services:
  db:
    image: postgres:16
    container_name: trails-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trails}
      POSTGRES_USER: ${POSTGRES_USER:-trails}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trails}
    ports:
      - "5432:5432"
    volumes:
      - trails-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trails"]
      interval: 5s
      timeout: 5s
      retries: 5

  garmin-service:
    build:
      context: ./garmin-service
      dockerfile: Dockerfile
    container_name: trails-garmin
    ports:
      - "5000:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trails-app
    depends_on:
      db:
        condition: service_healthy
      garmin-service:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/trails}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-trails}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-trails}
      GARMIN_SERVICE_URL: ${GARMIN_SERVICE_URL:-http://garmin-service:5000}
      SECURITY_REQUIRE_HTTPS: "false"
      COOKIE_SECURE: "false"
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  trails-postgres-data:
