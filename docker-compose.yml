services:
  # PostgreSQL Database
  db:
    image: dhi.io/postgres:16-alpine
    container_name: trails-db
    environment:
      POSTGRES_DB: trails
      POSTGRES_USER: trails_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "-c max_connections=100"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trails_user -d trails"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - trails-network

  garmin-service:
    build:
      context: ./garmin-service
      dockerfile: Dockerfile
    container_name: trails-garmin
    expose:
      - "5000"
    environment:
      SERVICE_AUTH_TOKEN: ${GARMIN_SERVICE_AUTH_TOKEN:?Set GARMIN_SERVICE_AUTH_TOKEN}
      PORT: "5000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    user: "65534:65534"
    networks:
      - trails-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trails-app
    depends_on:
      db:
        condition: service_healthy
      garmin-service:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/trails
      SPRING_DATASOURCE_USERNAME: trails_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      GARMIN_SERVICE_URL: http://garmin-service:5000
      GARMIN_SERVICE_AUTH_TOKEN: ${GARMIN_SERVICE_AUTH_TOKEN:?Set GARMIN_SERVICE_AUTH_TOKEN}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY}
      SECURITY_REQUIRE_HTTPS: "false"
      COOKIE_SECURE: "false"
      SPRING_PROFILES_ACTIVE: "docker"
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "java", "-cp", "/app/healthcheck-classes", "com.example.trails.HealthcheckProbe"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    user: "65534:65534"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - trails-network

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: trails-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - trails-network

networks:
  trails-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
