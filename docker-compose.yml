services:
  garmin-service:
    build:
      context: ./garmin-service
      dockerfile: Dockerfile
    container_name: trails-garmin
    expose:
      - "5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trails-app
    depends_on:
      garmin-service:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL:?Set DB_URL}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      GARMIN_SERVICE_URL: http://garmin-service:5000
      SECURITY_REQUIRE_HTTPS: "false"
      COOKIE_SECURE: "false"
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY}
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped
